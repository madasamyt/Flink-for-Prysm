# ============================================================
# Prysm Kinesis → Flink stream topology
# Stream ARNs and bucket names are resolved at runtime from
# AWS SSM Parameter Store using the path pattern:
#   /prysm/{env}/kinesis/stream/{streamKey}
# This file contains only non-sensitive structural metadata.
# ============================================================

streams:
  # --- Customer domain -------------------------------------------------------
  - key: customer-profile
    streamNameParamPath: /prysm/{env}/kinesis/stream/customer-profile
    avroSchema: customer-profile.avsc
    glueRegistryName: prysm-{env}-registry
    glueSchemaName: CustomerProfile
    icebergTable: customer.customer_profiles
    partitionBy: [eventDate, countryCode]
    sensitiveFields: [firstName, lastName, email, phone, dateOfBirth, ipAddress]
    streamType: CUSTOMER
    efoConsumer: prysm-flink-customer-profile-{env}

  - key: customer-preferences
    streamNameParamPath: /prysm/{env}/kinesis/stream/customer-preferences
    avroSchema: customer-preferences.avsc
