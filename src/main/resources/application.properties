# ============================================================
# Prysm Flink Pipeline — Application Configuration
#
# SENSITIVE values (credentials, keys) are NEVER stored here.
# They are loaded at startup from:
#   - AWS Secrets Manager  : /prysm/{env}/secrets/*
#   - AWS SSM Param Store  : /prysm/{env}/config/*
#
# Values with ${SSM:/path} placeholders are resolved by
# ParameterStoreUtil at job startup.
# ============================================================

# ── Environment ──────────────────────────────────────────────
pipeline.name=prysm-kinesis-flink-pipeline
pipeline.env=${PRYSM_ENV:dev}
pipeline.region=${AWS_REGION:us-east-1}

# ── Flink Job ─────────────────────────────────────────────────
flink.job.name=${pipeline.name}-${pipeline.env}
flink.parallelism.default=4
flink.parallelism.ingestion=8
flink.parallelism.analytics=4
flink.parallelism.recommendation=2

# ── Checkpointing ─────────────────────────────────────────────
# Checkpoint bucket resolved at runtime from SSM
checkpoint.s3.bucket=${SSM:/prysm/${pipeline.env}/config/checkpoint-bucket}
checkpoint.s3.prefix=flink-checkpoints/${pipeline.name}
checkpoint.interval.ms=60000
checkpoint.timeout.ms=300000
checkpoint.min.pause.between.ms=5000
checkpoint.max.concurrent=1
checkpoint.unaligned.enabled=false

# ── State Backend ─────────────────────────────────────────────
state.backend=rocksdb
state.backend.rocksdb.incremental=true

# ── Kinesis Consumer ──────────────────────────────────────────
kinesis.consumer.starting.position=LATEST
# Use TRIM_HORIZON on first run to backfill; switch to LATEST after
kinesis.consumer.starting.position.backfill=TRIM_HORIZON
kinesis.consumer.enhanced.fan.out=true
kinesis.consumer.record.publisher.type=EFO
kinesis.consumer.efo.registration=LAZY
# Milliseconds to pause between GetRecords calls (non-EFO fallback)
kinesis.consumer.getrecords.interval.ms=1000
kinesis.consumer.deagg.enabled=true

# ── Iceberg / S3 Data Lake ────────────────────────────────────
# Warehouse bucket resolved at runtime from SSM
iceberg.warehouse.bucket=${SSM:/prysm/${pipeline.env}/config/data-lake-bucket}
iceberg.warehouse.prefix=iceberg-warehouse
iceberg.catalog.name=prysm_glue_catalog
iceberg.catalog.type=glue
iceberg.glue.database.prefix=prysm_
# Databricks-compatible write format (Parquet is universal)
iceberg.write.format=PARQUET
iceberg.write.parquet.compression=ZSTD
iceberg.write.target.file.size.bytes=134217728
# Commit every N records OR every N seconds (whichever comes first)
iceberg.sink.flush.interval.ms=30000
iceberg.sink.flush.max.events=100000
# Enable Iceberg V2 row-level deletes (required for UPDATE/DELETE support in Databricks)
iceberg.write.metadata.delete-after-commit.enabled=true
iceberg.write.metadata.previous-versions-max=5

# ── AWS Glue Schema Registry ──────────────────────────────────
glue.schema.registry.region=${pipeline.region}
# Schema compatibility mode for all schemas (allows adding optional fields)
glue.schema.registry.compatibility=BACKWARD
glue.schema.registry.compression=ZLIB
# Auto-register schema if not found (disable in prod to prevent accidental drift)
glue.schema.registry.auto.register=${GLUE_AUTO_REGISTER:false}

# ── PII / KMS Encryption ──────────────────────────────────────
# KMS key ARN resolved at runtime from Secrets Manager
pii.kms.key.arn=${SSM:/prysm/${pipeline.env}/config/pii-kms-key-arn}
pii.encryption.enabled=true
pii.pseudonymisation.enabled=true
# Salt resolved from Secrets Manager at startup — NEVER hardcode
pii.pseudonymisation.hmac.secret=${SECRETS:/prysm/${pipeline.env}/secrets/pii-hmac-secret}

# ── Analytics Windows ─────────────────────────────────────────
analytics.window.rolling.minutes=30
analytics.window.session.gap.minutes=60
analytics.window.daily.timezone=UTC

# ── Recommendation Engine ─────────────────────────────────────
recommendation.products.per.recommendation=5
recommendation.scan.ttl.days=90
recommendation.purchase.history.lookback.days=365
recommendation.collaborative.filter.enabled=true
recommendation.min.scan.score.change.threshold=3.0

# ── Logging ───────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.nuskin.prysm=INFO
logging.level.org.apache.flink=WARN
logging.level.org.apache.iceberg=WARN
